name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitco-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t fitco-backend:${{ github.sha }} .

  deploy:
    name: Deploy Docker Compose Stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: fitco-production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
          DEPLOY_BRANCH: main
          USE_SUDO_DOCKER: ${{ secrets.USE_SUDO_DOCKER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: EC2_PROJECT_PATH,DEPLOY_BRANCH,USE_SUDO_DOCKER
          timeout: 60m
          command_timeout: 60m
          script: |
            set -euo pipefail

            deploy_stack() {
              if [ -z "${EC2_PROJECT_PATH:-}" ]; then
                echo "EC2_PROJECT_PATH secret is required"
                exit 1
              fi

              cd "$EC2_PROJECT_PATH"

              for repo in fitco-backend fitco-dashboard; do
                if [ ! -d "$repo/.git" ]; then
                  echo "Missing required repo: $EC2_PROJECT_PATH/$repo"
                  exit 1
                fi

                echo "Updating $repo"
                git -C "$repo" fetch origin "$DEPLOY_BRANCH"
                git -C "$repo" reset --hard "origin/$DEPLOY_BRANCH"
              done

              if [ "${USE_SUDO_DOCKER:-false}" = "true" ]; then
                sudo docker compose up -d --build
                sudo docker compose ps
              else
                docker compose up -d --build
                docker compose ps
              fi
            }

            if command -v flock >/dev/null 2>&1; then
              (
                flock 9
                deploy_stack
              ) 9>/tmp/fitco-compose-deploy.lock
            else
              echo "flock is not installed; running deployment without server-side lock"
              deploy_stack
            fi
